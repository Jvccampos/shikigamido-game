services:
  game:
    build: .
    ports: ["3000:3000"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes: ["game-data:/data"]
    restart: unless-stopped
volumes:
  game-data:
